name: 홈페이지 사진 가져오기
on:
  push:
    branches: [pfsrc]
    paths: ['list.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python fetch.py
      - run: |
          git config user.name "bodaart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "홈페이지 사진 가져옴" || exit 0
          git push
