<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:500;src:url(package/dist/public/static/Pretendard-Medium.otf)}
@font-face{font-family:P;font-weight:600;src:url(package/dist/public/static/Pretendard-SemiBold.otf)}
@font-face{font-family:P;font-weight:700;src:url(package/dist/public/static/Pretendard-Bold.otf)}
@font-face{font-family:P;font-weight:800;src:url(package/dist/public/static/Pretendard-ExtraBold.otf)}
@font-face{font-family:P;font-weight:900;src:url(package/dist/public/static/Pretendard-Black.otf)}
html,body{margin:0;background:#0C0B10}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0C0B10;font-family:P;color:#F7F2EB}
#stage *{position:absolute;box-sizing:border-box}
.bg{left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.p3{left:0;top:0;width:1080px;height:1920px;perspective:1700px;perspective-origin:50% 45%}
.card{border-radius:12px;overflow:hidden;box-shadow:0 60px 120px rgba(0,0,0,.65),0 10px 30px rgba(0,0,0,.4);transform-style:preserve-3d;background:#111}
.card img{left:0;top:0;width:100%;height:100%;object-fit:cover}
.card .gl{left:0;top:0;width:100%;height:100%;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 70%);mix-blend-mode:screen}
.mask{overflow:hidden;white-space:nowrap}
#stage .mask>div{position:relative;white-space:nowrap}
.cmask{overflow:hidden}
.sweep{left:-400px;top:-300px;width:700px;height:2600px;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,240,220,.55) 50%,rgba(255,255,255,0) 100%);mix-blend-mode:screen;pointer-events:none}
.flash{left:0;top:0;width:1080px;height:1920px;background:#FFF8F0}
.vig{left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse 75% 65% at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
.glow{width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(196,135,124,.28) 0%,rgba(196,135,124,.10) 35%,rgba(0,0,0,0) 70%)}
#grain{left:-20px;top:-20px;width:1120px;height:1960px;background-size:1120px 1960px;mix-blend-mode:overlay;opacity:.5}
.strip{overflow:hidden}
.strip div{left:0;top:0;width:100%;height:100%;background-size:cover;background-position:center}
.pill{height:62px;border-radius:31px;padding:0 28px;line-height:62px;font-size:32px;font-weight:700;letter-spacing:-0.5px;white-space:nowrap}
.rule{height:3px;background:#D9C6B2}
</style></head><body><div id="stage"></div>
<script src="mg1.js"></script></body></html>
